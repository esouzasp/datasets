name: Scrape Ranking ENEM (Evolucional)

on:
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano do ranking (endpoint ranked-schools/<ano>)"
        default: "2025"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests playwright && python -m playwright install --with-deps chromium
      - run: python enem_ranking/scrape.py --ano ${{ github.event.inputs.ano || '2025' }}
      - name: Commit dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add enem_ranking/data/
          git diff --cached --quiet || git commit -m "data: ranking ENEM ${{ github.event.inputs.ano || '2025' }} (Evolucional)"
          git push
